<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Qué Carajo Lee</title>
    <style>
      /* Tokens from app/src/styles/tokens.css. Plus Jakarta is not in the
         bundled shell, so the fallback stack matches --font-body. */
      :root {
        --bg: #f5f0eb;
        --black: #0a0a0a;
        --white: #ffffff;
        --qcl-orange: #e8624a;
        --qcl-feedback-title-size: 22px;
        --qcl-feedback-title-leading: 1.2;
        --qcl-heading-tracking: -0.02em;
        --qcl-button-pad-block: 15px;
        --qcl-button-pad-inline: 28px;
        --qcl-button-size: 15px;
        --qcl-button-weight: 800;
        --qcl-feedback-pad-block: 40px;
        --radius-card: 16px;
        --space-3: 0.75rem;
        --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--black);
        font-family: var(--font-body);
      }
      main {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: calc(var(--qcl-feedback-pad-block) + env(safe-area-inset-top, 0px))
          var(--space-3)
          calc(var(--qcl-feedback-pad-block) + env(safe-area-inset-bottom, 0px));
        text-align: center;
      }
      h1 {
        margin: 0 0 var(--space-3);
        font-size: var(--qcl-feedback-title-size);
        font-weight: 800;
        letter-spacing: var(--qcl-heading-tracking);
        line-height: var(--qcl-feedback-title-leading);
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: var(--qcl-button-pad-block) var(--qcl-button-pad-inline);
        border: 0;
        border-radius: var(--radius-card);
        background: var(--qcl-orange);
        color: var(--white);
        font-family: inherit;
        font-size: var(--qcl-button-size);
        font-weight: var(--qcl-button-weight);
        letter-spacing: var(--qcl-heading-tracking);
        -webkit-appearance: none;
        appearance: none;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión.</h1>
      <button type="button" id="retry">Reintentar.</button>
    </main>
    <script>
      /* Capacitor does not inject the bridge on errorPath. Go back to the
         one live host; if it still fails, the native shell shows this page
         again. Do not auto-redirect on load (avoids a tight failure loop). */
      var LIVE = "https://qcl.matidelcastillo.workers.dev/";
      document.getElementById("retry").addEventListener("click", function () {
        location.replace(LIVE);
      });
    </script>
  </body>
</html>
