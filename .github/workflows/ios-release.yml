name: iOS Release to TestFlight

# Manual only, to keep GitHub Actions minutes low.
# Required repo secrets (create new values for QCL; do not copy QC's):
#   APPLE_TEAM_ID
#   APPSTORE_API_KEY_ID
#   APPSTORE_API_ISSUER_ID
#   APPSTORE_API_KEY_P8_BASE64
on:
  workflow_dispatch:

jobs:
  build-and-upload:
    name: Build & Upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      BUNDLE_ID: com.quecarajolees.app
      SCHEME: App
      PROJECT: ios/App/App.xcodeproj
      ARCHIVE_PATH: build/App.xcarchive
      EXPORT_PATH: build/export

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          echo "Available Xcode installations:"
          ls -1 /Applications | grep -E '^Xcode' || true
          XCODE_APP=""
          for candidate in $(ls -1 /Applications | grep -E '^Xcode_?[0-9]' | sort -rV); do
            if [ -d "/Applications/$candidate" ]; then
              XCODE_APP="/Applications/$candidate"
              break
            fi
          done
          if [ -z "$XCODE_APP" ] && [ -d "/Applications/Xcode.app" ]; then
            XCODE_APP="/Applications/Xcode.app"
          fi
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode installation found on runner."
            exit 1
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          echo "Installed iOS platforms / SDKs:"
          xcodebuild -showsdks | grep -i ios || true

      - name: Print Xcode version (sanity)
        run: xcodebuild -version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Capacitor sync iOS
        run: bunx cap sync ios

      - name: Install App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${API_KEY_ID:-}" ] || [ -z "${API_ISSUER_ID:-}" ] || [ -z "${API_KEY_P8_BASE64:-}" ] || [ -z "${TEAM_ID:-}" ]; then
            echo "::error::Missing one or more secrets: APPLE_TEAM_ID, APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID, APPSTORE_API_KEY_P8_BASE64"
            exit 1
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "$API_KEY_P8_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::APPSTORE_API_KEY_P8_BASE64 did not decode to a .p8 private key."
            exit 1
          fi
          echo "AUTH_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "API key installed."

      - name: Bump build number
        working-directory: ios/App
        run: |
          agvtool new-version -all "$GITHUB_RUN_NUMBER"
          echo "Build number set to $GITHUB_RUN_NUMBER"

      - name: Generate ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p build
          echo "Starting archive. Full xcodebuild output will be written to build/archive.log"
          set +e
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            clean archive 2>&1 | tee build/archive.log
          archive_status=${PIPESTATUS[0]}
          set -e
          if [ "$archive_status" -ne 0 ]; then
            echo "::error::Archive failed. Showing relevant xcodebuild errors below."
            echo "--- Matching errors from build/archive.log ---"
            grep -nEi "error:|CodeSign|Provisioning profile|requires a provisioning profile|No profiles|Signing|Failed|unable|xcodebuild:" build/archive.log || true
            echo "--- Last 250 lines of build/archive.log ---"
            tail -n 250 build/archive.log
            exit "$archive_status"
          fi

      - name: Export IPA
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "Starting IPA export. Full xcodebuild output will be written to build/export.log"
          set +e
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$EXPORT_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" 2>&1 | tee build/export.log
          export_status=${PIPESTATUS[0]}
          set -e
          if [ "$export_status" -ne 0 ]; then
            echo "::error::IPA export failed. Showing relevant xcodebuild errors below."
            echo "--- Matching errors from build/export.log ---"
            grep -nEi "error:|CodeSign|Provisioning profile|No profiles|Signing|Failed|unable|xcodebuild:" build/export.log || true
            echo "--- Last 250 lines of build/export.log ---"
            tail -n 250 build/export.log
            exit "$export_status"
          fi
          echo "Exported files:"
          ls -la "$EXPORT_PATH"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH=$(ls "$EXPORT_PATH"/*.ipa | head -n1)
          echo "Uploading $IPA_PATH"
          set +e
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID" \
            --verbose 2>&1 | tee /tmp/altool.log
          altool_status=${PIPESTATUS[0]}
          set -e
          if [ "$altool_status" -ne 0 ]; then
            echo "::error::altool upload failed (exit $altool_status). Relevant errors:"
            grep -iE "error|invalid|failed|train|version|CFBundle" /tmp/altool.log || true
            exit "$altool_status"
          fi
          echo "altool upload succeeded"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            build/
          if-no-files-found: ignore
          retention-days: 5

      - name: Cleanup API key
        if: always()
        run: |
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_"*.p8 || true
